<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="4" />
  
  <!-- Pickleball Court Lines Abstract -->
  <path d="M 96 140 L 416 140" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" stroke-dasharray="12 10" />
  <path d="M 256 96 L 256 416" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6" />

  <!-- Pickleball Paddle Shape -->
  <g transform="translate(140, 100) rotate(-18, 120, 140)">
    <!-- Paddle Head -->
    <rect x="50" y="30" width="140" height="170" rx="46" fill="#1e293b" stroke="#38bdf8" stroke-width="8" />
    <rect x="62" y="42" width="116" height="146" rx="36" fill="#0f172a" />
    <!-- Paddle Grip / Handle -->
    <rect x="106" y="200" width="28" height="96" rx="10" fill="#f8fafc" />
    <line x1="106" y1="230" x2="134" y2="225" stroke="#94a3b8" stroke-width="3" />
    <line x1="106" y1="250" x2="134" y2="245" stroke="#94a3b8" stroke-width="3" />
    <line x1="106" y1="270" x2="134" y2="265" stroke="#94a3b8" stroke-width="3" />
  </g>

  <!-- Pickleball (Neon Ball with Holes) -->
  <g transform="translate(300, 150)">
    <circle cx="64" cy="64" r="62" fill="url(#limeGrad)" filter="drop-shadow(0 12px 24px rgba(74, 222, 128, 0.4))" />
    <!-- Ball Holes -->
    <circle cx="64" cy="64" r="10" fill="#065f46" opacity="0.75" />
    <circle cx="40" cy="46" r="8" fill="#065f46" opacity="0.75" />
    <circle cx="88" cy="46" r="8" fill="#065f46" opacity="0.75" />
    <circle cx="36" cy="82" r="8" fill="#065f46" opacity="0.75" />
    <circle cx="92" cy="82" r="8" fill="#065f46" opacity="0.75" />
    <circle cx="64" cy="104" r="8" fill="#065f46" opacity="0.75" />
    <circle cx="64" cy="24" r="8" fill="#065f46" opacity="0.75" />
  </g>

  <!-- Cafe Cup & Refreshment Steam Overlay -->
  <g transform="translate(240, 260)">
    <!-- Cup Body -->
    <path d="M 30 50 L 50 140 Q 55 155 70 155 L 140 155 Q 155 155 160 140 L 180 50 Z" fill="url(#orangeGrad)" filter="drop-shadow(0 12px 20px rgba(249, 115, 22, 0.4))" />
    <!-- Cup Rim & Lid -->
    <rect x="20" y="38" width="170" height="16" rx="8" fill="#f8fafc" />
    <!-- Straw -->
    <rect x="140" y="-12" width="12" height="52" rx="4" transform="rotate(16, 140, -12)" fill="#38bdf8" />
    <!-- Steam waves -->
    <path d="M 60 26 Q 54 10 68 0" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 95 26 Q 89 6 103 -4" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Sparkle / Badge -->
    <circle cx="105" cy="100" r="22" fill="#ffffff" opacity="0.95" />
    <text x="105" y="106" font-family="sans-serif" font-size="20" font-weight="900" fill="#ea580c" text-anchor="middle">⚡</text>
  </g>
</svg>
